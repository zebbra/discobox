        <rect x="134" y="252" width="24" height="18" fill="#9f8cf0"/><rect x="182" y="252" width="24" height="18"/><rect x="230" y="252" width="24" height="18"/><rect x="278" y="252" width="24" height="18" fill="#c4b5fd"/><rect x="326" y="252" width="24" height="18"/>
        <rect x="110" y="270" width="24" height="18"/><rect x="158" y="270" width="24" height="18" fill="#5fe0b5"/><rect x="206" y="270" width="24" height="18"/><rect x="254" y="270" width="24" height="18"/><rect x="302" y="270" width="24" height="18"/>
        <rect x="134" y="288" width="24" height="18"/><rect x="182" y="288" width="24" height="18" fill="#9f8cf0"/><rect x="230" y="288" width="24" height="18"/><rect x="278" y="288" width="24" height="18"/><rect x="326" y="288" width="24" height="18"/>
