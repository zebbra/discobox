  <!-- text -->
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
    <text x="420" y="185" font-size="96" font-weight="bold" fill="url(#title)" letter-spacing="2">discobox</text>
    <text x="424" y="233" font-size="30" fill="#e9e4ff">Keeps NetBox in step with Netdisco</text>
    <text x="424" y="277" font-size="20" fill="#9a93c4">Netdisco <tspan fill="#5fe0b5">→</tspan> NetBox inventory sync</text>
  </g>
