        <rect x="134" y="108" width="24" height="18" fill="#c4b5fd"/><rect x="182" y="108" width="24" height="18"/><rect x="230" y="108" width="24" height="18" fill="#9f8cf0"/><rect x="278" y="108" width="24" height="18"/><rect x="326" y="108" width="24" height="18" fill="#5fe0b5"/>
