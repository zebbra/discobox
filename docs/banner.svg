        <rect x="134" y="180" width="24" height="18" fill="#5fe0b5"/><rect x="182" y="180" width="24" height="18"/><rect x="230" y="180" width="24" height="18" fill="#9f8cf0"/><rect x="278" y="180" width="24" height="18"/><rect x="326" y="180" width="24" height="18" fill="#9f8cf0"/>
