        <rect x="110" y="108" width="24" height="18"/><rect x="158" y="108" width="24" height="18"/><rect x="206" y="108" width="24" height="18"/><rect x="254" y="108" width="24" height="18"/><rect x="302" y="108" width="24" height="18"/>
