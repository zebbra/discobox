<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <radialGradient id="bg" cx="22%" cy="45%" r="85%">
      <stop offset="0" stop-color="#2a1f4d"/>
      <stop offset="0.55" stop-color="#14112a"/>
      <stop offset="1" stop-color="#0a0915"/>
    </radialGradient>
    <radialGradient id="ballShade" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#5fe0b5"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="230" cy="200" r="110"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- light beams -->
  <g opacity="0.16">
    <polygon points="230,200 760,-40 900,-40" fill="#a78bfa"/>
    <polygon points="230,200 1280,60 1280,150" fill="#5fe0b5"/>
    <polygon points="230,200 1280,330 1280,420" fill="#f472b6"/>
    <polygon points="230,200 700,440 840,440" fill="#60a5fa"/>
    <polygon points="230,200 -40,440 60,440" fill="#facc15"/>
  </g>

