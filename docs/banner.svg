        <rect x="134" y="198" width="24" height="18"/><rect x="182" y="198" width="24" height="18"/><rect x="230" y="198" width="24" height="18"/><rect x="278" y="198" width="24" height="18"/><rect x="326" y="198" width="24" height="18"/>
