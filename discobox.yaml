# Discobox configuration
# Credentials stay in environment variables:
#   NETBOX_URL, NETBOX_TOKEN
#   NETDISCO_URL, NETDISCO_TOKEN  (or NETDISCO_USERNAME + NETDISCO_PASSWORD)
#
# Set any value to null (or omit it) to disable that feature/mapping.

sync:
  vip_mode: threenode       # threenode | soft | hard | off; fallback for any vendor not
                            # listed in vip_mode_by_vendor below
  # vip_mode_by_vendor:     # override vip_mode per vendor (nd_device["vendor"], already
  #                         # lowercased at the source — see e.g. tests/samples/*-device.json).
  #                         # Useful when a VIP/floating address behaves differently across
  #                         # vendors — e.g. Fortinet FGCP's cluster IP is a real, distinct
  #                         # member address (threenode keeps the VIP device + its address),
  #                         # while a VSS/HSRP floating IP really belongs to whichever
  #                         # physical interface answers it (soft frees it for reassignment).
  #   fortinet: threenode
  lldp_clear_stale: false     # also gates stale discobox-owned cable deletion
  housekeeping: false
  pause_on_error: false
  touch_cooldown_days: 1    # skip a device's sync while its touch field (below) shows a
                            # real change within this many days; 0 disables the skip
  ha_resolve:               # resolve a vendor-reported HA hostname (e.g. a FortiGate's own
                            # `hostname`, unrelated to its NetBox name) to the correct NetBox
                            # device via a metric whose labels already carry that mapping —
                            # tried before the exact/contains-name and serial fallbacks.
                            # Reuses reconcile.liveness.url/timeout; disabled unless that's set.
    metric: fgHaStatsSyncStatus_info
    hostname_label: fgHaStatsHostname   # label carrying the vendor-reported hostname
    target_label: netbox_primary_ip     # label already carrying the correct NetBox device IP
    instance_label: instance   # label carrying the already-known NetBox device FQDN — used to
                                # also ensure EACH HA member's own management IP is set as
                                # primary_ip4 (not just whichever one triggered the lookup),
                                # even when Netdisco never discovers that member's IP directly
    mgmt_iface_name: mgmt1     # interface created for a member that has none yet, to hold
                                # its management IP
  # no_mac: false
  # no_ip: false            # skips interface IPs; the management IP is always synced
  # no_modules: false
  # no_sfp: false
  # no_poe: false

cabling:
  scope: site               # site = same-site pairs only; null/empty to disable
  source_cf: source
  source_value: netdisco

custom_fields:
  source: source            # interface + device source CF; null to disable
  source_value: netdisco
  os_version: os_version    # null to disable
  os_name: os_name          # null to disable
  os_release: os_release    # null to disable
  stack_members: stack_members  # total physical units in a traditional stack with >1 member;
                                # unset for standalone/VSS/FEX/a degraded 1-member stack (a count
                                # of 1 or a split count adds no signal) — null to disable
  stack_members_only_increase: true  # never write a lower count than what's already recorded —
                                      # a dead stack member must not silently ratchet it down.
                                      # Set false to always follow Netdisco's current count.
  touch: netdisco_last_update  # date field written with today's date whenever a sync makes a
                                # real change (device fields, interfaces, IPs, modules, cables,
                                # SFPs, PoE...); untouched on a no-op sync — null to disable.
                                # Also used to skip a device outright (see sync.touch_cooldown_days)
                                # and to pre-filter /sync/all when a Netbox device filter is given.
  neighbor_text: neighbor
  neighbor_port: neighbor_port
  neighbor_device: neighbor_device
  neighbor_iface: neighbor_iface

reconcile:
  interval: 86400           # seconds
  max_queued: null          # abort reconcile if Netdisco queue exceeds this
  max_failed: null
  max_enqueue: null         # cap devices enqueued per reconcile run
  # roles: [router, switch, firewall, appliance]   # NetBox device-role slugs; default shown, empty/omitted = all roles
  # statuses: [active]                 # NetBox device statuses to reconcile; default shown.
                                        # Devices under maintenance still respond to SNMP in most
                                        # setups (see the network-netbox-ping alert rules, which
                                        # treat active|maintenance as reachable) — add "maintenance"
                                        # here to reconcile those too.
  require_auth_tag: true     # only enqueue discovery for devices with snmp_auth_profile set;
                             # without it Netdisco has no credentials to try, so discovery just fails
  defer_if_queued: true      # postpone reconcile (re-checked every defer_seconds) while any sync
                             # is still queued/in-flight, instead of piling more work on top of
                             # a backlog (e.g. a large hook burst) that's still draining
  defer_seconds: 3600
  liveness:                 # skip enqueueing devices a metrics store reports as down
    url: null               # Prometheus-compatible query API incl. tenant prefix, e.g.
                            # http://vmselect:8481/select/0/prometheus — null disables
    query: 'max_over_time(up{job="snmp"}[6h])'   # > 0 = alive, 0 = down, absent = unknown (still enqueued)
    label: netbox_primary_ip  # series label identifying the device
    key: ip                 # device attribute compared to the label: ip | name
    timeout: 15             # query timeout, seconds

auto_create:
  role: null                # NetBox device-role slug; null disables auto-create
  site: null                # fallback NetBox site slug (overridden by SNMP location)
  status: active
  location: false           # parse SNMP location → NetBox location hierarchy

auth:
  metrics_path: /metrics
  # token: null             # prefer DISCOBOX_AUTH_TOKEN env var
